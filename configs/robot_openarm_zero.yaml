# OpenArm bimanual rig in MuJoCo, ZERO-SHOT mode: a frontier VLM drives the full plugin
# harness (planner + per-step atomic controller) through scripts/run_real.py, exactly as it
# drives a hardware Franka or Piper.
#
# Fine-tuned counterpart on the same world: configs/robot_openarm.yaml
# (scripts/run_openarm_mvtoken.py, one action token per step, planner-free).
#
# The simulator is self-contained: the physics/IK/camera glue is vendored under
# core/openarm/backend/, and the robot model comes from the openarm-mujoco wheel. No
# embodied_ai-llm checkout is involved.
#
# No site layer: this rig has no hardware identity to calibrate. The optional overlays
# carry lab-internal endpoints and experiment state and are absent from the public release.
overlays:
  - {path: experiments/current_openarm.yaml, optional: true}

# The plugin harness reads this key to select the simulator session + controller.
hardware: openarm
controller_prompt: openarm

# ----- Task -----------------------------------------------------------------
task: "Pick up the red cube and place it on the green cube"
# task: "Pick up the red cube and place it on the table"
# With `scene: insert_flower` (needs the one-time VLABench asset fetch):
# task: "Insert the roses into the vase"

# ----- VLM ------------------------------------------------------------------
# gemini | chatgpt (see vlm_backends below); local serves any OpenAI-compatible model.
vlm_backend: gemini

# ----- Rollout --------------------------------------------------------------
max_steps: 200

# ----- Plugins ----------------------------------------------------------------
# The paper's zero-shot stack. `affordance` needs the high-res renders below; turn it on
# only after checking what `--hd-res` actually buys on this 1280x720 head camera.
plugins:
  subgoal: true
  proprioception: true
  recovery: true
  variable_step: true
  # Side-on wrist vision needs a fresh observation after every move.
  action_chunk: false
  mem_text: true
  smooth: true
  dagger: false
  coords: false
  mcq: false
  deepplan: false
  rotation: false
  video_ref: false
  affordance: false

# ----- Plugin settings ------------------------------------------------------
gripper_color: ""            # the OpenArm jaws are dark grey in the head camera
high_above_table_m: 0.08
coarse_step_m: 0.04
up_step_m: 0.04
action_chunk_step_num: 3
mem_text_len: 5
affordance_verify_rounds: 1
hd_res: 640                  # planner / affordance renders (the head camera is 1280x720)

# ----- Scene ----------------------------------------------------------------
# null -> the three-cube tabletop (ships with the repo). `insert_flower` swaps in the
# VLABench vase + three roses; fetch its meshes first:
#   bash scripts/model/download_vlabench_assets.sh
scene: null

# Independent physics check after the final DONE; never shown to the policy.
# Change this together with task/scene when running a different task.
#   red_on_green    -- released red cube stably supported by green (default task)
#   none            -- VLM-only completion, for tasks without a predicate
#   cubes_on_table  -- default scene: all three cubes still resting on the tabletop
#   flowers_in_vase -- insert_flower: every rose tip at the vase mouth
success_check: red_on_green

# Which arm the single-arm loop drives. The other holds the pose it had at startup.
arm_side: right

# ----- Cameras --------------------------------------------------------------
# The model ships camera_head (fixed third-person, 1280x720) plus one eye-in-hand camera
# per arm (960x600). The head view is the AgentView: a wrist view moves with the arm and
# cannot be the global reference the prompt's left/right rules are written against.
observation_resolution: 256
# Same rotate -> centre-crop -> letterbox contract as every other embodiment. 1280x720 is
# 16:9 while the training rigs are 4:3, so crop to 4:3 BEFORE letterboxing or the scene
# occupies a thin strip.
#
# Native upright views. The head view maps physical +X away from the base to
# image UP and +Y to image LEFT. Keep the existing zero-shot FWD/BACK exchange
# at execution; controller_openarm.txt describes exactly that emitted vocabulary.
# The wrist camera looks almost horizontally forward (optical axis ~[.91,.35,-.225]
# at right-arm home). Image up is mainly world +Z: its image height is NOT an
# overhead depth coordinate. The OpenArm prompt uses AgentView for depth/lateral
# alignment and wrist vision for side-grasp height/confirmation.
# Fine-tuned mode keeps its separate legacy preprocessing; that adapter was not
# trained on OpenArm, so matching a camera transform alone cannot ensure transfer.
agentview_rotation_degrees: 0
agentview_flip: none
agentview_crop_aspect: 1.3333
# Per arm, because the mounts are mirrored. Both are native upright here (image-down is
# ~world -Z on either arm at home; the two views are horizontal mirror images), so the
# entries match -- but a side must be listed before --arm can drive it.
wrist_by_arm:
  right: {rotation_degrees: 0, flip: none}
  left: {rotation_degrees: 0, flip: none}
wrist_crop_aspect: 1.3333
use_wrist_image: true

# ----- Robot / world --------------------------------------------------------
control_hz: 60
# Commanded step per token. The sim tracks its setpoint closely (measured 20.1 mm achieved
# for a 20 mm command on all three axes), so unlike RoboLab's relative IK this needs no lag
# compensation: step_m IS the distance the arm travels. Kept in sync with
# configs/primitives_openarm.yaml, which owns the token -> displacement mapping. This is
# also the harness's fine step (the Franka key `fine_step_m` is derived from it);
# `--fine-m` overrides it for one run.
step_m: 0.02
# Physics ticks per setpoint command. The naive axis signs are wrong here: the prompt is
# written in IMAGE terms, and the head camera's image-left is world +Y -- see
# configs/primitives_openarm.yaml, which owns the token -> displacement mapping.
sim_ticks_per_command: 6
settle_steps: 6
settle_dt_s: 0.001
gripper_ticks: 60            # ticks to let the jaw travel before its width is read
settle_ticks: 60

# Gripper: 0 rad is fully CLOSED and the joint-range extreme is fully OPEN; the sign is
# mirrored per arm. Measured free gap runs 0.0 m closed -> 0.1425 m open.
gripper_close_threshold_m: 0.06
empty_width_m: 0.006
open_width_m: 0.06
gripper_settle_s: 0.0
gripper_min_settle_s: 0.0

# ----- Safety ---------------------------------------------------------------
# Lower bound on wrist/control-point Z in arm_origin (table is at -0.298 m).
# The controller holds the home orientation: the fingers approach horizontally.
# At the old -0.225 floor the pad collision mesh overlaps only ~1 mm of a cube's
# top edge, so closing is empty. At -0.250 the pads grip a 45 mm cube and the full
# moving gripper clears the table. Verified by the contact/pick/lift regression.
# This floor is calibrated for the fixed horizontal orientation, not pitched tools.
enable_z_floor: true
z_floor_m: -0.250

# ----- Models ---------------------------------------------------------------
vlm:
  base_url: http://localhost:8000/v1
  # Match controller_openarm.txt's emitted depth tokens; images stay upright.
  execution_token_swap: [MV_FWD, MV_BACK]

vlm_backends:
  gemini:
    provider: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.1-pro    # the paper's default zero-shot model
    api_key_env: GEMINI_API_KEY
    max_tokens: 2048
    reasoning_cot: true
    reasoning_effort: medium   # low | medium | high
    max_retries: 10
  chatgpt:
    provider: openai
    base_url: https://api.openai.com/v1
    model: gpt-5.5
    api_key_env: CHATGPT_API_KEY
    max_tokens: 2048
    reasoning_cot: true
    reasoning_effort: medium   # low | medium | high
    max_retries: 10
  local:
    # Any OpenAI-compatible local server; `model` must match what it reports.
    provider: vllm
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.5-9B
    max_tokens: 2048
    reasoning_cot: true
  gateway:
    # Any OpenAI-compatible hosted gateway. Point `base_url` (or declare `base_url_env`)
    # and `model_env` at your own endpoint; the key is read from $OPENAI_API_KEY, so no
    # secret lives in this file. ChatGPT-style models take `max_completion_tokens`, which
    # the client's openai dialect writes for you.
    provider: openai
    base_url: https://api.openai.com/v1
    base_url_env: OPENAI_BASE_URL
    model: gpt-6.1-sol
    model_env: OPENAI_MODEL
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    reasoning_cot: true
    reasoning_effort: xhigh   # low | medium | high
    max_retries: 10
